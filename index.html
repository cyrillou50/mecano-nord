<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Facturation de l'atelier — Mécano Nord, Day of Decay.">
<title>Mécano Nord — Facturation</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff2bd1'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='bold' fill='%23100a14' text-anchor='middle'%3EMN%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="fx__glow"></div>
<div class="fx" aria-hidden="true">
  <div class="fx__scan"></div>
  <div class="fx__grain"></div>
  <div class="fx__vign"></div>
</div>

<!-- Écran de connexion (rempli par ui.js tant que personne n'est connecté) -->
<div id="gate" class="gate" hidden></div>

<!-- Site -->
<div id="app" hidden>

  <header class="topbar" id="topbar"></header>

  <main class="wrap page">

    <h1 class="page-title">Facturation</h1>
    <p class="page-sub">Bon de travail · atelier</p>

    <div class="catbar">
      <nav class="cattabs" id="cattabs" aria-label="Catégories"></nav>
      <button class="btn btn--ghost" id="btn-costs" type="button">Coûts</button>
    </div>

    <nav class="subtabs" id="subtabs" aria-label="Sous-catégories" hidden></nav>

    <div id="catalog" class="catalog"></div>
    <div id="empty" class="empty" hidden></div>

  </main>

  <!-- Barre de récapitulatif -->
  <footer class="dock" id="dock">
    <button class="dock__grab" id="dock-grab" aria-label="Réduire ou déplier le récapitulatif">
      <span></span>
    </button>

    <div class="dock__mini">
      <b id="dock-mini-txt">Panier vide</b>
    </div>

    <div class="dock__inner">
      <div class="dock__head">
        <h2>Ressources nécessaires</h2>
        <div class="dock__meta">
          <span class="pill pill--dim" id="dock-kinds" hidden></span>
          <span class="pill" id="dock-count">0 objet</span>
        </div>
      </div>

      <div class="reslist" id="dock-res"></div>
      <p class="dock__empty" id="dock-empty">
        Choisis des objets ci-dessus : les ressources à sortir du stock s'affichent ici.
      </p>

      <div class="dock__actions">
        <button class="btn btn--primary" id="btn-save" disabled>Sauvegarder le BT</button>
        <button class="btn btn--danger" id="btn-reset" disabled>Tout réinitialiser</button>
      </div>
    </div>
  </footer>

</div>

<div class="toasts" id="toast-root" aria-live="polite"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/catalog.seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/webhook.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
